[package]
name = "mitm-proxy"
version = "0.1.0"
edition = "2024"
description = "Standalone man-in-the-middle proxy terminating HTTP/1.x, HTTP/2 and HTTP/3"
license = "MIT OR Apache-2.0"

[features]
default = []
# Engine redirects protected-browser QUIC to TCP, so HTTP/3 is opt-in.
http3 = ["dep:h3", "dep:h3-quinn", "dep:quinn"]
# The standalone CLI is not shipped as part of the ACE service.
proxy-cli = ["dep:clap", "dep:color-eyre", "dep:tracing-subscriber"]

[lib]
name = "mitm_proxy"
path = "src/lib.rs"

[[bin]]
name = "mitm-proxy"
path = "src/main.rs"
required-features = ["proxy-cli"]

[[test]]
name = "cli_tests"
path = "tests/cli_tests.rs"
required-features = ["proxy-cli"]

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
color-eyre = { version = "0.6.5", optional = true }
eyre = "0.6.14"
futures = "0.3.34"
h3 = { version = "0.0.8", optional = true }
h3-quinn = { version = "0.0.10", optional = true }
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
quinn = { version = "0.11.12", optional = true }
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
rustls-platform-verifier = "0.7.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
rcgen = { version = "0.14.10", features = ["pem", "x509-parser"] }
tempfile = "3"
x509-parser = { version = "0.18", features = ["verify"] }
