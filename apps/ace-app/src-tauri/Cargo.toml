[package]
name = "ace-app"
version = "0.1.0"
description = "Ace Blocker frontend desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ace_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# tauri-typegen = { version = "0.5.2", features = ["build-time-generation"] }
# tonic-prost-build = "0.14.2"

[dependencies]
ace-engine = { path = "../../../crates/ace-engine" }
app_dirs2 = "2.5.5"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-wdio = "1.5.1"
tauri-plugin-wdio-webdriver = "1.5.1"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# prost = "0.14.1"
# tonic = "0.14.2"
# tonic-prost = "0.14.1"
tauri-plugin-fs = "2.5.2"
tauri-plugin-log = "2.9"
tauri-plugin-store = "2.4.5"
tauri-plugin-dialog = "2.7.3"

