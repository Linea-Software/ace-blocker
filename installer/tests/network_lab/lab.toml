[[cases]]
id = "LAB-01"
kind = "baseline"
environments = [
  "ubuntu-direct",
  "arch-direct",
  "cachyos-direct",
  "windows-direct",
]
expected = "Baseline service/route information only; requires subsequent browser evidence"

[[cases]]
id = "LAB-02"
kind = "routing"
environments = [
  "ubuntu-wireguard",
  "arch-wireguard",
  "cachyos-wireguard",
  "windows-wireguard",
  "ubuntu-openvpn",
  "arch-openvpn",
  "cachyos-openvpn",
]
expected = "Record both original route and VPN route; compare protected browser behavior separately"

[[cases]]
id = "LAB-03"
kind = "browser-guard"
environments = [
  "ubuntu-tor",
  "arch-tor",
  "cachyos-tor",
  "ubuntu-tor-browser",
  "arch-tor-browser",
  "cachyos-tor-browser",
  "windows-tor-browser",
  "ubuntu-proton",
  "arch-proton",
  "cachyos-proton",
  "windows-proton",
]
expected = "Record Linux browser proxy-policy status; do not enable it without opt-in"

[[cases]]
id = "VPN-01"
kind = "browser"
environments = [
  "ubuntu-direct",
  "arch-direct",
  "cachyos-direct",
  "windows-direct",
]
expected = "With no VPN, blocked origin must be denied and allowed origin reachable"

[[cases]]
id = "VPN-02"
kind = "browser"
environments = [
  "ubuntu-wireguard",
  "arch-wireguard",
  "cachyos-wireguard",
  "windows-wireguard",
]
expected = "IPv4 WireGuard lab tunnel only; verify IPv6 separately, and require real blocked/allowed browser-origin evidence"

[[cases]]
id = "VPN-03"
kind = "browser"
environments = [
  "ubuntu-openvpn",
  "arch-openvpn",
  "cachyos-openvpn",
  "ubuntu-wireguard",
  "arch-wireguard",
  "cachyos-wireguard",
  "windows-wireguard",
]
expected = "Split tunnel includes/excludes browser; blocked origin must remain denied"

[[cases]]
id = "VPN-04"
kind = "browser"
environments = [
  "ubuntu-proton",
  "arch-proton",
  "cachyos-proton",
  "windows-proton",
]
expected = "Real provider extension disconnected/connected; compare guard off and on"

[[cases]]
id = "VPN-05"
kind = "browser"
environments = [
  "ubuntu-proton",
  "arch-proton",
  "cachyos-proton",
  "windows-proton",
]
expected = "Optional managed browser-policy guard must prevent proxy-based bypass when enabled"

[[cases]]
