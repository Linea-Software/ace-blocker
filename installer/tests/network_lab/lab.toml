# Dedicated gateway VM, snapshotted separately from the three client VMs.
[[environments]]
name = "wireguard-gateway"
domain = "ace-lab-vpn-gateway"
distribution = "ubuntu"
provider = "wireguard"
snapshot = "wireguard-gateway-base"

[[cases]]
id = "LAB-01"
kind = "baseline"
environments = ["ubuntu-direct", "arch-direct", "cachyos-direct", "windows-direct"]
expected = "Baseline service/route information only; requires subsequent browser evidence"

[[cases]]
id = "LAB-02"
kind = "routing"
environments = ["ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard", "ubuntu-openvpn", "arch-openvpn", "cachyos-openvpn"]
expected = "Record both original route and VPN route; compare protected browser behavior separately"

[[cases]]
id = "LAB-03"
kind = "browser-guard"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor", "ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser", "ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton"]
expected = "Record Linux browser proxy-policy status; do not enable it without opt-in"

[[cases]]
id = "VPN-01"
kind = "browser"
environments = ["ubuntu-direct", "arch-direct", "cachyos-direct", "windows-direct"]
expected = "With no VPN, blocked origin must be denied and allowed origin reachable"

[[cases]]
id = "VPN-02"
kind = "browser"
environments = ["ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard"]
expected = "IPv4 WireGuard lab tunnel only; verify IPv6 separately, and require real blocked/allowed browser-origin evidence"

[[cases]]
id = "VPN-03"
kind = "browser"
environments = ["ubuntu-openvpn", "arch-openvpn", "cachyos-openvpn", "ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard"]
expected = "Split tunnel includes/excludes browser; blocked origin must remain denied"

[[cases]]
id = "VPN-04"
kind = "browser"
environments = ["ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton"]
expected = "Real provider extension disconnected/connected; compare guard off and on"

[[cases]]
id = "VPN-05"
kind = "browser"
environments = ["ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton"]
expected = "Optional managed browser-policy guard must prevent proxy-based bypass when enabled"

[[cases]]
id = "VPN-06"
kind = "manual"
environments = ["ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton", "ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard"]
expected = "Desktop VPN plus proxy extension concurrently; record all routes and DNS"

[[cases]]
id = "VPN-07"
kind = "browser"
environments = ["ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton", "ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard", "ubuntu-openvpn", "arch-openvpn", "cachyos-openvpn"]
expected = "VPN starts before/after engine and browser; policy remains enforced"

[[cases]]
id = "VPN-08"
kind = "manual"
environments = ["ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard", "ubuntu-openvpn", "arch-openvpn", "cachyos-openvpn", "ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton"]
expected = "Disconnect/reconnect, kill switch and server change preserve or visibly degrade enforcement"

[[cases]]
id = "VPN-09"
kind = "manual"
environments = ["ubuntu-wireguard", "arch-wireguard", "cachyos-wireguard", "windows-wireguard", "ubuntu-openvpn", "arch-openvpn", "cachyos-openvpn", "ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton"]
expected = "DoH IPv6 QUIC and UDP paths do not open uninspected browser egress"

[[cases]]
id = "VPN-10"
kind = "browser"
environments = ["ubuntu-socks", "arch-socks", "cachyos-socks"]
expected = "Opaque HTTPS proxy on ports 443/4443/8443 must be observed/blocked or documented as gap"

[[cases]]
id = "VPN-11"
kind = "browser"
environments = ["ubuntu-socks", "arch-socks", "cachyos-socks", "ubuntu-tor", "arch-tor", "cachyos-tor"]
expected = "Local SOCKS/HTTP proxy cannot convert a blocked browser origin into untracked egress"

[[cases]]
id = "VPN-12"
kind = "manual"
environments = ["ubuntu-proton", "arch-proton", "cachyos-proton", "windows-proton", "ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Repeat with supported browsers/profiles and record process identities"

[[cases]]
id = "VPN-13"
kind = "manual"
environments = ["ubuntu-windscribe", "arch-windscribe", "cachyos-windscribe"]
expected = "Use real free provider when authenticated snapshot is available; do not attempt paid tiers"

[[cases]]
id = "VPN-14"
kind = "routing"
environments = ["ubuntu-direct", "ubuntu-wireguard", "ubuntu-openvpn", "ubuntu-tor", "ubuntu-tor-browser", "ubuntu-socks", "ubuntu-i2p", "ubuntu-proton", "ubuntu-windscribe", "arch-direct", "arch-wireguard", "arch-openvpn", "arch-tor", "arch-tor-browser", "arch-socks", "arch-i2p", "arch-proton", "arch-windscribe", "cachyos-direct", "cachyos-wireguard", "cachyos-openvpn", "cachyos-tor", "cachyos-tor-browser", "cachyos-socks", "cachyos-i2p", "cachyos-proton", "cachyos-windscribe"]
expected = "Inspect Linux RPDB, nftables and TUN/route changes across distributions"

[[cases]]
id = "TOR-01"
kind = "browser"
environments = ["ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Tor Browser reaches allowed site but not an active blocked origin"

[[cases]]
id = "TOR-02"
kind = "browser"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor"]
expected = "Firefox/Chrome through TOR SOCKS5 cannot bypass an active protected block"

[[cases]]
id = "TOR-03"
kind = "tor-socks"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor"]
expected = "Tor daemon and torsocks installed, port 9050 listening; infrastructure only"

[[cases]]
id = "TOR-04"
kind = "manual"
environments = ["ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Tor Browser with obfs4 bridge; record actual origin outcome and bridge availability"

[[cases]]
id = "TOR-05"
kind = "manual"
environments = ["ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Snowflake/WebTunnel transports; distinguish network failure from blocked-origin bypass"

[[cases]]
id = "TOR-06"
kind = "browser"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor", "ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Start TOR before/after Ace and compare traffic enforcement"

[[cases]]
id = "TOR-07"
kind = "manual"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor"]
expected = "Restart TOR under active Hard Lock without losing protected network rules"

[[cases]]
id = "TOR-08"
kind = "manual"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor"]
expected = "Nondefault SOCKS ports/process aliases cannot bypass browser protection"

[[cases]]
id = "TOR-09"
kind = "browser"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor", "ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Loopback, remote DNS, IPv6 and new browser profiles remain accounted for"

[[cases]]
id = "TOR-10"
kind = "manual"
environments = ["ubuntu-tor", "arch-tor", "cachyos-tor", "ubuntu-tor-browser", "arch-tor-browser", "cachyos-tor-browser", "windows-tor-browser"]
expected = "Cross-distro and Windows TOR behavior recorded separately"

[[cases]]
id = "I2P-01"
kind = "manual"
environments = ["ubuntu-i2p", "arch-i2p", "cachyos-i2p"]
expected = "Local I2P HTTP proxy and outproxy scenario, using controlled destinations only"

# Optional fully local WireGuard fixture. Values are examples: set gateway
# domain and endpoint to a reachable owned disposable Ubuntu VM before executing.
# Generated private keys stay in /etc/wireguard inside each guest.
[wireguard_lab]
gateway_domain = "ace-lab-vpn-gateway"
gateway_distribution = "ubuntu"
endpoint_ipv4 = "192.168.122.40"

[wireguard_lab.peers.ubuntu]
iface = "acegw0"
port = 51821
subnet = "10.66.10.0/24"
gateway_address = "10.66.10.1/24"
client_address = "10.66.10.2/32"

[wireguard_lab.peers.arch]
iface = "acegw1"
port = 51822
subnet = "10.66.11.0/24"
gateway_address = "10.66.11.1/24"
client_address = "10.66.11.2/32"

[wireguard_lab.peers.cachyos]
iface = "acegw2"
port = 51823
subnet = "10.66.12.0/24"
gateway_address = "10.66.12.1/24"
client_address = "10.66.12.2/32"
