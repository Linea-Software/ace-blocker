# Optional fully local WireGuard fixture. Values are examples: set gateway
# domain and endpoint to a reachable owned disposable Ubuntu VM before executing.
# Generated private keys stay in /etc/wireguard inside each guest.
[wireguard_lab]
gateway_vm = "gateway"
gateway_distribution = "ubuntu"

[wireguard_lab.peers.ubuntu]
iface = "acegw0"
port = 51821
subnet = "10.66.10.0/24"
gateway_address = "10.66.10.1/24"
client_address = "10.66.10.2/32"
gateway_link = "172.29.10.1/30"
client_link = "172.29.10.2/30"

[wireguard_lab.peers.arch]
iface = "acegw1"
port = 51822
subnet = "10.66.11.0/24"
gateway_address = "10.66.11.1/24"
client_address = "10.66.11.2/32"
gateway_link = "172.29.11.1/30"
client_link = "172.29.11.2/30"

[wireguard_lab.peers.cachyos]
iface = "acegw2"
port = 51823
subnet = "10.66.12.0/24"
gateway_address = "10.66.12.1/24"
client_address = "10.66.12.2/32"
gateway_link = "172.29.12.1/30"
client_link = "172.29.12.2/30"
