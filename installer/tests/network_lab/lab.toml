# Environment-per-provider snapshots, NOT snapshots per test case.
# Change 'domain' to the actual owned disposable libvirt domain before running.
# The same domain can have many named libvirt snapshots; it must be shut off
# for snapshot creation/revert. Explicit --execute and confirmation are required.

[lab]
libvirt_uri = "qemu:///session"
artifacts = ".artifacts"

[[environments]]
name = "ubuntu-direct"
domain = "ace-lab-ubuntu"
distribution = "ubuntu"
provider = "direct"
snapshot = "ubuntu-ace-ready"

