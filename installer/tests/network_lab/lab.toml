# NovaGPT 0.5.x managed forks only. No host libvirt VM imports or fallbacks.
# Fill in vm-... IDs returned by 'fork-create' once, for each approved fork.
# Preserve reusable environment snapshots on the owned instance, not per test ID.

[lab]
mcp_url = "http://127.0.0.1:8787/mcp"
token_env = "NOVAGPT_HTTP_TOKEN"
artifacts = ".artifacts"

[vms.ubuntu]
image = "ubuntu-ace-ready"
id = ""                    # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat"]
display = true
guest_agent = true

[vms.arch]
image = "arch-ace-ready"
id = ""                  # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat"]
display = true
guest_agent = true

[vms.cachyos]
image = "cachyos-ace-ready"
id = ""                     # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat"]
display = true
guest_agent = true

[vms.windows]
image = "windows-ace-ready"
id = ""                     # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat"]
display = true
guest_agent = true

[vms.ubuntu-wg]
image = "ubuntu-ace-ready"
id = ""                                  # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat", "connect:ace-ubuntu"]
display = true
guest_agent = true

[vms.arch-wg]
image = "arch-ace-ready"
id = ""                                # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat", "connect:ace-arch"]
display = true
guest_agent = true

[vms.cachyos-wg]
image = "cachyos-ace-ready"
id = ""                                   # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 4
memory_mb = 8192
networks = ["nat", "connect:ace-cachyos"]
display = true
guest_agent = true

[vms.gateway]
image = "ubuntu-ace-ready"
id = ""                                                                          # Set to the NovaGPT vm-<16hex> identifier; never a libvirt domain
cpus = 2
memory_mb = 4096
networks = ["nat", "listen:ace-ubuntu", "listen:ace-arch", "listen:ace-cachyos"]
display = false
guest_agent = true

