# Keep all dependency ecosystems used by the unified desktop repository current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /apps/ace-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-patch-minor:
        update-types:
          - minor
          - patch
    # SvelteKit 3 currently declares a TypeScript 6 peer dependency.
    # Coordinate TypeScript 7 separately after ecosystem compatibility is verified.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
