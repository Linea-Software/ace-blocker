# Keep all dependency ecosystems used by the unified desktop repository current.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: bun
    directory: /apps/ace-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-patch-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
