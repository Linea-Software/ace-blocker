name: Desktop release candidates (Windows and Linux)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Three-part release version (for example 0.3.0)
        required: true
        type: string
      stage_on_site:
        description: Stage the Windows MSI on the Ace website (never publish it)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ace-blocker-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate release source and unified product version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must be X.Y.Z"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Run releases from main only"; exit 1; }
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["VERSION"]
          sources = {
              "engine": tomllib.loads(Path("crates/ace-engine/Cargo.toml").read_text())["package"]["version"],
              "watchdog": tomllib.loads(Path("crates/ace-watchdog/Cargo.toml").read_text())["package"]["version"],
              "release verifier": tomllib.loads(Path("crates/ace-update-security/Cargo.toml").read_text())["package"]["version"],
              "Tauri Rust": tomllib.loads(Path("apps/ace-app/src-tauri/Cargo.toml").read_text())["package"]["version"],
              "Tauri config": json.loads(Path("apps/ace-app/src-tauri/tauri.conf.json").read_text())["version"],
              "Svelte package": json.loads(Path("apps/ace-app/package.json").read_text())["version"],
          }
          mismatches = {name: version for name, version in sources.items() if version != expected}
          if mismatches:
              raise SystemExit(f"Release version {expected} differs from product components: {mismatches}")
          PY

  windows:
    name: Package Windows x64 MSI
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install locked frontend dependencies
        working-directory: apps/ace-app
        run: bun install --frozen-lockfile
      - name: Build engine and watchdog
        env:
          # Public, compile-time trust roots (not private signing keys).
          ACE_RELEASE_MANIFEST_URL: ${{ vars.ACE_RELEASE_MANIFEST_URL }}
          ACE_RELEASE_MANIFEST_PUBLIC_KEY_HEX: ${{ vars.ACE_RELEASE_MANIFEST_PUBLIC_KEY_HEX }}
          ACE_RELEASE_PUBLISHER_CERT_SHA256: ${{ vars.ACE_RELEASE_PUBLISHER_CERT_SHA256 }}
        run: cargo build --release --locked -p ace-engine -p ace-watchdog --bins
      - name: Build desktop app
        working-directory: apps/ace-app
        run: bun run tauri build --no-bundle
      - name: Install WiX 4
        shell: pwsh
        run: |
          dotnet tool install -g wix --version 4.0.5
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add -g WixToolset.Util.wixext/4.0.5
      - name: Prepare MSI inputs
        shell: pwsh
        run: |
          $engine = Join-Path $PWD "release-input\engine"
          $app = Join-Path $PWD "release-input\app"
          New-Item -ItemType Directory -Force -Path $engine, $app | Out-Null
          foreach ($name in @("ace-engine.exe", "ace-watchdog.exe", "ace-redirect.exe", "install-cert.exe")) {
            Copy-Item "target\release\$name" $engine -ErrorAction Stop
          }
          $wintun = "crates\ace-tun\thirdparty\wintun"
          Copy-Item "$wintun\bin\amd64\wintun.dll" $engine -ErrorAction Stop
          Copy-Item "$wintun\LICENSE.txt" (Join-Path $engine "WINTUN-LICENSE.txt") -ErrorAction Stop
          Copy-Item "target\release\ace-app.exe" $app -ErrorAction Stop
      - name: Package MSI
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          & ".\installer\package.ps1" -Version $env:VERSION -EngineArtifacts ".\release-input\engine" -AppArtifacts ".\release-input\app"
          if ($LASTEXITCODE -ne 0) { throw "MSI packaging failed" }
      - name: Build Windows provenance manifest
        id: candidate
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $msi = (Resolve-Path "installer\dist\AceBlocker-$env:VERSION.msi").Path
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $msi).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $env:VERSION
            os = "windows"
            architecture = "x64"
            sha256 = $sha
            sourceRepository = "${{ github.repository }}"
            sourceCommit = "${{ github.sha }}"
            sourceRunId = "${{ github.run_id }}"
            sourceRunUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            engineCommit = "${{ github.sha }}"
            appCommit = "${{ github.sha }}"
          }
          $manifest | ConvertTo-Json | Set-Content "installer\dist\release-candidate-windows.json" -Encoding utf8
          "sha256=$sha" >> $env:GITHUB_OUTPUT
      # Candidate packaging is not publication. Only a separately approved
      # signing service may sign the MSI; never store a PFX/private key here.
      # Staging must reject unsigned/wrong-publisher artifacts.
      - name: Verify signed MSI before optional website staging
        if: ${{ inputs.stage_on_site }}
        shell: pwsh
        env:
          PUBLISHER_PIN: ${{ vars.ACE_RELEASE_PUBLISHER_CERT_SHA256 }}
          VERSION: ${{ inputs.version }}
        run: |
          & ".\\installer\\verify-product-signature.ps1" `
            -MsiPath "installer\\dist\\AceBlocker-$env:VERSION.msi" `
            -ExpectedPublisherCertSha256 $env:PUBLISHER_PIN

      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v7
        with:
          name: AceBlocker-${{ inputs.version }}-windows-x64
          path: |
            installer/dist/AceBlocker-${{ inputs.version }}.msi
            installer/dist/release-candidate-windows.json
          if-no-files-found: error
          retention-days: 14
      - name: Stage MSI on Ace website
        if: ${{ inputs.stage_on_site }}
        shell: pwsh
        env:
          INGEST_URL: ${{ vars.ACE_RELEASE_INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.ACE_RELEASE_INGEST_TOKEN }}
          VERSION: ${{ inputs.version }}
          SHA256: ${{ steps.candidate.outputs.sha256 }}
        run: |
          if (-not $env:INGEST_URL -or -not $env:INGEST_TOKEN) {
            throw "Release ingestion URL and token are required for staging."
          }
          $form = @{
            file = Get-Item "installer\dist\AceBlocker-$env:VERSION.msi"
            version = $env:VERSION
            os = "windows"
            architecture = "x64"
            sha256 = $env:SHA256
            sourceRepository = "${{ github.repository }}"
            sourceCommit = "${{ github.sha }}"
            sourceRunId = "${{ github.run_id }}"
            sourceRunUrl = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            engineCommit = "${{ github.sha }}"
            appCommit = "${{ github.sha }}"
          }
          Invoke-RestMethod -Uri $env:INGEST_URL -Method Post -Headers @{ Authorization = "Bearer $env:INGEST_TOKEN" } -Form $form

  linux:
    name: Package Linux x64 tarball
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils
      - name: Validate Linux installer and desktop metadata
        run: |
          bash -n installer/linux/install.sh
          bash -n installer/linux/migrate-legacy-data.sh
          python3 -m py_compile installer/linux/browser-proxy-policy.py
          python3 -m unittest discover -s installer/linux/tests -p 'test_*.py' -v
          desktop-file-validate installer/linux/ace-blocker.desktop
          desktop-file-validate installer/linux/ace-blocker-handler.desktop
          if installer/linux/install.sh >/dev/null 2>&1; then
            echo "Unprivileged install unexpectedly succeeded" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked frontend dependencies
        working-directory: apps/ace-app
        run: bun install --frozen-lockfile
      - name: Build Linux services and utilities
        run: cargo build --release --locked -p ace-engine -p ace-watchdog --bins
      - name: Build Linux desktop app
        working-directory: apps/ace-app
        run: bun run tauri build --no-bundle
      - name: Package Linux candidate with offline packs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          package="AceBlocker-${VERSION}-linux-x64"
          mkdir -p "release-input/$package" release-dist
          for binary in ace-engine ace-watchdog ace-redirect install-cert ace-app; do
            install -m 0755 "target/release/$binary" "release-input/$package/$binary"
          done
          cp -R installer/bundled-packs "release-input/$package/bundled-packs"
          install -m 0755 installer/linux/install.sh "release-input/$package/install.sh"
          install -m 0755 installer/linux/browser-proxy-policy.py "release-input/$package/browser-proxy-policy.py"
          install -m 0755 installer/linux/migrate-legacy-data.sh "release-input/$package/migrate-legacy-data.sh"
          install -m 0644 installer/linux/ace-blocker.desktop "release-input/$package/ace-blocker.desktop"
          install -m 0644 installer/linux/ace-blocker-handler.desktop "release-input/$package/ace-blocker-handler.desktop"
          install -m 0644 apps/ace-app/src-tauri/icons/128x128.png "release-input/$package/ace-blocker.png"
          cp docs/RELEASING.md "release-input/$package/RELEASING.md"
          tar -C release-input -czf "release-dist/$package.tar.gz" "$package"
      - name: Build Linux provenance manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          archive = Path("release-dist") / f"AceBlocker-{version}-linux-x64.tar.gz"
          manifest = {
              "version": version,
              "os": "linux",
              "architecture": "x64",
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "sourceRepository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["GITHUB_SHA"],
              "sourceRunId": os.environ["GITHUB_RUN_ID"],
              "sourceRunUrl": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "engineCommit": os.environ["GITHUB_SHA"],
              "appCommit": os.environ["GITHUB_SHA"],
          }
          Path("release-dist/release-candidate-linux.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v7
        with:
          name: AceBlocker-${{ inputs.version }}-linux-x64
          path: |
            release-dist/AceBlocker-${{ inputs.version }}-linux-x64.tar.gz
            release-dist/release-candidate-linux.json
          if-no-files-found: error
          retention-days: 14

  draft:
    name: Assemble draft GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: AceBlocker-${{ inputs.version }}-windows-x64
          path: release-assets/windows
      - uses: actions/download-artifact@v8
        with:
          name: AceBlocker-${{ inputs.version }}-linux-x64
          path: release-assets/linux
      - name: Verify candidate manifests and prepare checksums
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "release-assets/windows/AceBlocker-$VERSION.msi" dist/
          cp "release-assets/linux/AceBlocker-$VERSION-linux-x64.tar.gz" dist/
          cp release-assets/windows/release-candidate-windows.json dist/
          cp release-assets/linux/release-candidate-linux.json dist/
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          expected_sha = os.environ["EXPECTED_SHA"]
          for platform, asset in (
              ("windows", f"AceBlocker-{version}.msi"),
              ("linux", f"AceBlocker-{version}-linux-x64.tar.gz"),
          ):
              manifest = json.loads(Path(f"dist/release-candidate-{platform}.json").read_text())
              digest = hashlib.sha256((Path("dist") / asset).read_bytes()).hexdigest()
              if (manifest["version"], manifest["os"], manifest["sourceCommit"], manifest["sha256"]) != (
                  version, platform, expected_sha, digest
              ):
                  raise SystemExit(f"Candidate provenance/hash mismatch: {platform}")
          PY
          (cd dist && sha256sum *.msi *.tar.gz > SHA256SUMS)
      - name: Create or update draft release (never publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [[ "$(cat release-state.txt)" != "true" ]]; then
              echo "Refusing to overwrite an already published release: $tag"
              exit 1
            fi
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "Draft release tag $tag points to a different commit: $target"
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --draft --prerelease --target "$GITHUB_SHA" \
              --title "Ace Blocker $tag (candidate)" \
              --notes "Windows MSI and Linux x64 manual-install candidate. Not validated for production; see RELEASING.md inside the Linux archive and repository release documentation."
          fi
