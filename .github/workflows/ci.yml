name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install locked frontend dependencies
        working-directory: apps/ace-app
        run: bun install --frozen-lockfile
      - name: Build frontend and generate Paraglide translations
        working-directory: apps/ace-app
        run: bun run build
      - name: Share built frontend with native jobs
        uses: actions/upload-artifact@v4
        with:
          name: desktop-frontend-dist
          path: apps/ace-app/build
          if-no-files-found: error
          retention-days: 1
      - name: Typecheck frontend
        working-directory: apps/ace-app
        run: bun run check
      - name: Run unit tests
        working-directory: apps/ace-app
        run: bun run test:unit

  native:
    name: Rust checks and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: frontend
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux Tauri build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Reuse verified frontend assets
        uses: actions/download-artifact@v4
        with:
          name: desktop-frontend-dist
          path: apps/ace-app/build
      - name: Check entire Rust workspace
        run: cargo check --locked --workspace --all-targets --timings
      # Release-profile metadata does not share build products with dev/test;
      # validate it on main and on demand instead of repeating it on every PR.
      - name: Check release service binaries
        if: github.event_name != 'pull_request'
        run: cargo check --release --locked -p ace-engine -p ace-watchdog --timings
      - name: Test engine RPC, scheduling, and watchdog
        shell: bash
        run: |
          cargo test --locked -p ace-watchdog-protocol
          cargo test --locked -p ace-watchdog --bin ace-watchdog
          cargo test --locked -p ace-engine --lib remoc_tests
          cargo test --locked -p ace-engine --lib manager::network::schedule::tests

      - name: Preserve Cargo compilation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ matrix.os }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  proxy-http3:
    name: Optional proxy HTTP/3 regression suite
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: proxy-http3
      - name: Exercise opt-in QUIC transport
        run: cargo test --locked -p mitm-proxy --features proxy-cli,http3
