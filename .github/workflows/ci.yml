name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - name: Install app dependencies
        working-directory: apps/ace-app
        run: bun install --frozen-lockfile
      - name: Verify the unified Rust workspace and Tauri application
        run: cargo check --locked --workspace --all-targets
      - name: Check release-only service contracts
        run: cargo check --release --locked -p ace-engine -p ace-watchdog
      - name: Test watchdog contracts and engine RPC
        run: |
          cargo test --locked -p ace-watchdog-protocol
          cargo test --locked -p ace-engine --lib remoc_tests
      - name: Check app UI
        working-directory: apps/ace-app
        run: |
          bun run check
          bun run build
